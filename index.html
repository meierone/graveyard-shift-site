<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Graveyard Shift</title>
<link rel="icon" href="icon.png" />
<style>
  :root { color-scheme: light dark; --bg: #f6f1e4; --fg: #1b1730; --muted: #5d5670; --accent: #7e2a40; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1730; --fg: #ece2c6; --muted: #a99f8a; --accent: #f2a541; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; text-align: center; }
  img { width: 128px; height: 128px; image-rendering: pixelated; }
  h1 { color: var(--accent); margin: 12px 0 4px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: 15px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="" />
  <h1>Graveyard Shift</h1>
  <p>Nachtwächter Earl hat das falsche Buch vorgelesen. Jetzt klickt er Untote weg.</p>
  <p class="muted">Night watchman Earl read the wrong book aloud. Now he clicks away the undead.</p>
  <p><a href="privacy/">Datenschutzerklärung · Privacy Policy</a></p>
  <p class="muted">Fragen und Rückmeldungen · Questions and feedback:
    <a href="https://github.com/meierone/graveyard-shift-site/issues">GitHub Issues</a></p>
</main>
</body>
</html>
