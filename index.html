const SHOTS = ['1_titel', '3_friedhof', '4_boss', '6_geisterzug', '7_labor', '8_talentbaum'];

function pick() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && T[q]) return q;
  try { const s = localStorage.getItem('gs-site-lang'); if (s && T[s]) return s; } catch (e) { /* egal */ }
  for (const l of navigator.languages || [navigator.language || 'de']) {
    const k = String(l).slice(0, 2).toLowerCase();
    if (T[k]) return k;
  }
  return 'en';
}

function apply(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.getElementById('hero').src = `assets/shots/${lang}-hero.webp`;
  const f = document.getElementById('features');
  f.replaceChildren(...t.features.map(([h, p]) => {
    const d = document.createElement('article');
    d.className = 'feature';
    const h3 = document.createElement('h3'); h3.textContent = h;
    const pp = document.createElement('p'); pp.textContent = p;
    d.append(h3, pp);
    return d;
  }));
  const s = document.getElementById('shots');
  s.replaceChildren(...SHOTS.map((n) => {
    const img = document.createElement('img');
    img.src = `assets/shots/${lang}-${n}.webp`;
    img.width = 432; img.height = 864; img.loading = 'lazy'; img.alt = '';
    return img;
  }));
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  try { localStorage.setItem('gs-site-lang', lang); } catch (e) { /* nur für diese Sitzung */ }
}

document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => apply(b.dataset.lang)));
apply(pick());
